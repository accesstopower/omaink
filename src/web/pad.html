<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OmaInk">
<meta name="theme-color" content="#111214">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/pad.css">
<title>OmaInk</title>
</head>
<body>
<nav id="tools" aria-label="Tools">
  <div class="group" id="toolButtons">
    <button data-tool="pen" title="Pen"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
    <button data-tool="calligraphy" title="Calligraphy nib"><svg viewBox="0 0 24 24"><path d="M12 2l6 8-6 12-6-12z"/><path d="M12 10v6"/></svg></button>
    <button data-tool="marker" title="Marker"><svg viewBox="0 0 24 24"><path d="M6 18l3-7 8-8 4 4-8 8z"/><path d="M4 21h6"/></svg></button>
    <button data-tool="highlighter" title="Highlighter"><svg viewBox="0 0 24 24"><path d="M9 15l-2 4h5l1-2"/><path d="M9 15l8-11 4 3-8 11z"/><path d="M3 21h18" class="soft"/></svg></button>
    <button data-tool="laser" title="Laser pointer"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg></button>
    <button data-tool="arrow" title="Arrow"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><path d="M10 5h9v9"/></svg></button>
    <button data-tool="rect" title="Box"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button data-tool="ellipse" title="Circle"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
    <button data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="M3 16l9-9 7 7-5 5H8z"/><path d="M8 19h13"/></svg></button>
  </div>
  <div class="group" id="colors"></div>
  <div class="group" id="sizes"></div>
  <div class="group">
    <button id="nib" title="Nib angle" class="text">15°</button>
  </div>
  <div class="group">
    <button id="undo" title="Undo (two-finger tap)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button id="redo" title="Redo (three-finger tap)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
    <button id="clear" title="Clear"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button id="board" title="Board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21l4-4 4 4"/></svg></button>
    <button id="mirror" title="Show the computer's screen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg></button>
  </div>
  <div id="status" title="Connection"></div>
</nav>
<main id="stage">
  <div id="sheet">
    <img id="screen" alt="">
    <canvas id="ink"></canvas>
    <canvas id="live"></canvas>
  </div>
  <div id="notice" hidden></div>
</main>
<script src="/pad.js"></script>
</body>
</html>
